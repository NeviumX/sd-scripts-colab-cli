# MOSS-Image の LoRA 学習。キーは sd-scripts の引数名で、このまま sd-scripts の TOML として読める。
# ファイル名だけの値は VM の models フォルダーを指す。config/models.txt にあれば自動でダウンロードする。
# dataset_config と sample_prompts を省略すると、config/datasets/templates と config/prompts/templates の同じ名前のファイルを使う。
# 別のファイルを使うときは、手元のファイルをこのファイルからの相対パスで書く。
# これは原本なので書き換えない。変えたいキーだけを config/training/<このファイルの名前>.local.toml に書く。値を "" にするとキーを消せる。
# 生成確認を止めるときは local に sample_every_n_epochs = 0 と書く。
# 細部の損失を重くするときは local に loss_weighting = "detail_inv_t" を書く。
# GPU メモリが 20 GB 未満か RAM が 24 GB 未満なら、_bf16 を _int8_convrot のファイルに替える。

[model]
pretrained_model_name_or_path = "moss_image_base_bf16.safetensors"
vae = "flux2-vae.safetensors"
text_encoder = "qwen3.5_9b_bf16.safetensors"

[job]
output_name = "my-moss-lora"

[network]
network_module = "networks.lora_generic"
network_dim = 32
network_alpha = 32
network_train_unet_only = true

[optimizer]
optimizer_type = "AdamW8bit"
learning_rate = 1e-4                   # network_dim、network_alpha と一緒に変える
lr_scheduler = "constant"
max_grad_norm = 1.0

[flow_matching]
timestep_sampling = "truncated_logit_normal"
logit_mean = -1.09                     # マイナスで高ノイズ側のステップが多くなる
logit_std = 0.95
discrete_flow_shift = 1.0
timestep_cutoff = 0.95
timestep_uniform_ratio = 0.01
sigmoid_scale = 1.0

[precision_memory]
mixed_precision = "bf16"
save_precision = "bf16"
gradient_checkpointing = true
gradient_accumulation_steps = 1
cache_latents = true
cache_latents_to_disk = true
cache_text_encoder_outputs = true
cache_text_encoder_outputs_to_disk = true
max_data_loader_n_workers = 2
persistent_data_loader_workers = true

[caption]
enable_multiline_caption = true        # 無いとキャプションの 1 行目しか読まれない
caption_dropout_rate = 0.1

[run]
max_train_epochs = 7
seed = 42

[saving]
save_model_as = "safetensors"
save_every_n_epochs = 1
save_state = true
save_last_n_epochs_state = 1

[sampling]
sample_every_n_epochs = 1
