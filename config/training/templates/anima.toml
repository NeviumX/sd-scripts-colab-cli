# Anima の LoRA 学習。キーは sd-scripts の引数名で、このまま sd-scripts の TOML として読める。
# ファイル名だけの値は VM の models フォルダーを指す。config/models.txt にあれば自動でダウンロードする。
# dataset_config と sample_prompts を省略すると、config/datasets/templates と config/prompts/templates の同じ名前のファイルを使う。
# 別のファイルを使うときは、手元のファイルをこのファイルからの相対パスで書く。
# これは原本なので書き換えない。変えたいキーだけを config/training/<このファイルの名前>.local.toml に書く。値を "" にするとキーを消せる。
# 生成確認を止めるときは local に sample_every_n_epochs = 0 と書く。
# Anima-2.9B で学習するときは local に pretrained_model_name_or_path = "Anima-2.9B-preview-v1.safetensors" と書く。種類はファイルの中身から判定する。
# Anima-3.8B で学習するときは local に pretrained_model_name_or_path = "Anima-3.8B-v1.1.safetensors" と qwen35 = "qwen35_4b.safetensors" を書く。
# 細部の損失を重くするときは local に loss_weighting = "detail_inv_t" と weighting_scheme = "uniform" を書く。

[model]
pretrained_model_name_or_path = "anima-base-v1.0.safetensors"
vae = "qwen_image_vae.safetensors"
qwen3 = "qwen_3_06b_base.safetensors"
qwen_image_vae_2d = true

[job]
output_name = "my-anima-lora"

[network]
network_module = "networks.lora_anima"
network_dim = 32
network_alpha = 32
network_train_unet_only = true

[optimizer]
optimizer_type = "AdamW8bit"
optimizer_args = ["betas=0.9,0.99"]    # AdamW8bit 専用。CAME などに変えるときは外す
learning_rate = 2e-5
lr_scheduler = "constant_with_warmup"
lr_warmup_steps = 100
max_grad_norm = 1.0

[flow_matching]
timestep_sampling = "sigmoid"
discrete_flow_shift = 1.0
sigmoid_scale = 1.3

[precision_memory]
mixed_precision = "bf16"
save_precision = "bf16"
gradient_checkpointing = true
gradient_accumulation_steps = 1
cache_latents = true
cache_latents_to_disk = true
cache_text_encoder_outputs = true
cache_text_encoder_outputs_to_disk = true
max_data_loader_n_workers = 2
persistent_data_loader_workers = true

[run]
max_train_epochs = 10
seed = 42

[saving]
save_model_as = "safetensors"
save_every_n_epochs = 1
save_state = true
save_last_n_epochs_state = 1

[sampling]
sample_every_n_epochs = 1
